name: regex_literal
steps:
  - id: s
    url: '"{{base_url}}/echo"'
    query_transform: |
      {
        "literal_pattern": $replace(input.text, "[0-9]", "N"),
        "regex_literal": $replace(input.text, /[0-9]/, "N"),
        "split_literal": $split("a=1,b=2", /=/)
      }
output_transform: steps.s.query
